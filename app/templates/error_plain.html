<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }} · Wheelwright Workshop Orders</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <main class="error-page">
      <div class="error-page__inner">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="9.2" />
            <circle cx="12" cy="12" r="2.1" />
            <path d="M12 2.8v7.1M12 14.1v7.1M2.8 12h7.1M14.1 12h7.1M5.5 5.5l5 5M13.5 13.5l5 5M18.5 5.5l-5 5M10.5 13.5l-5 5" stroke-linecap="round" />
          </svg>
        </span>
        <p class="error-page__code">{{ code }}</p>
        <h1 class="section-title">{{ page_title }}</h1>
        <p class="muted">{{ detail }}</p>
        <div class="btn-row">
          <a class="btn btn--primary" href="/login">Sign in to the workshop</a>
        </div>
      </div>
    </main>
  </body>
</html>

{% extends "base.html" %}
{% block page_actions %}
<a class="btn btn--ghost" href="{{ back_href }}">{{ back_label }}</a>
{% endblock %}

{% block content %}
<section class="panel">
  <div class="empty">
    <p class="error-page__code">{{ code }}</p>
    <h2 class="empty__title">{{ page_title }}</h2>
    <p class="empty__text">{{ detail }}</p>
    <div class="btn-row">
      <a class="btn btn--primary" href="{{ back_href }}">{{ back_label }}</a>
      <a class="btn btn--ghost" href="/">Workshop overview</a>
    </div>
  </div>
</section>
{% endblock %}

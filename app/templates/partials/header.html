{% if current_user %}
<div class="identity">
  <span class="avatar" aria-hidden="true">{{ current_user.initials }}</span>
  <span class="identity__text">
    <span class="identity__name">{{ current_user.name }}</span>
    <span class="identity__role">{{ current_user.role }} · signed in</span>
  </span>
</div>
<form method="post" action="/logout" class="row">
  <button type="submit" class="btn btn--ghost btn--sm">Sign out</button>
</form>
{% endif %}

<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ page_title }} · Wheelwright Workshop Orders{% endblock %}</title>
    <meta
      name="description"
      content="Wheelwright Workshop Orders — cartwheel builds, iron tyre fittings and heritage commissions for a traditional wheelwright."
    />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body class="auth">
    <main class="auth__card">
      <div class="auth__brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="9.2" />
            <circle cx="12" cy="12" r="2.1" />
            <path d="M12 2.8v7.1M12 14.1v7.1M2.8 12h7.1M14.1 12h7.1M5.5 5.5l5 5M13.5 13.5l5 5M18.5 5.5l-5 5M10.5 13.5l-5 5" stroke-linecap="round" />
          </svg>
        </span>
        <span class="brand__text">
          <span class="brand__name">Wheelwright</span>
          <span class="brand__sub">Workshop orders</span>
        </span>
      </div>

      {% if flash %}
      <div class="{{ flash.css_class }}" role="status">{{ flash.message }}</div>
      {% endif %}

      {% block content %}{% endblock %}
    </main>
    <script src="/static/js/app.js" defer></script>
  </body>
</html>
